<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 430" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', sans-serif">
  <rect width="1240" height="430" fill="#fafafa"/>
  <text x="620" y="48" text-anchor="middle" font-size="22" font-weight="600" fill="#222">Delegation Breadcrumb：委托链可见</text>
  <text x="620" y="76" text-anchor="middle" font-size="13" fill="#888">任务在行动者之间流转时，每一层的能力与责任边界都被显式标注</text>

  <!-- node 1 -->
  <rect x="60" y="120" width="230" height="130" rx="12" fill="#fff" stroke="#4a7ebb" stroke-width="1.5"/>
  <text x="175" y="152" text-anchor="middle" font-size="16" font-weight="700" fill="#2c5d8f">你</text>
  <text x="175" y="180" text-anchor="middle" font-size="12.5" fill="#666">Goal: 季度供应商结算</text>
  <text x="175" y="202" text-anchor="middle" font-size="12.5" fill="#666">Budget: ≤ $25,000</text>
  <text x="175" y="228" text-anchor="middle" font-size="11.5" fill="#999">权限来源：本人</text>

  <line x1="295" y1="185" x2="345" y2="185" stroke="#aaa" stroke-width="2"/>
  <path d="M345 185 l-9 -6 v12 z" fill="#aaa"/>
  <text x="320" y="170" text-anchor="middle" font-size="10.5" fill="#bbb">委托</text>

  <!-- node 2 -->
  <rect x="350" y="120" width="230" height="130" rx="12" fill="#fff" stroke="#5a9364" stroke-width="1.5"/>
  <text x="465" y="152" text-anchor="middle" font-size="16" font-weight="700" fill="#3d6b47">项目主管 Agent</text>
  <text x="465" y="180" text-anchor="middle" font-size="12.5" fill="#666">分解任务 · 分配子目标</text>
  <text x="465" y="202" text-anchor="middle" font-size="12.5" fill="#666">不可动用资金</text>
  <text x="465" y="228" text-anchor="middle" font-size="11.5" fill="#999">边界：规划 ✓ · 支付 ✕</text>

  <line x1="585" y1="185" x2="635" y2="185" stroke="#aaa" stroke-width="2"/>
  <path d="M635 185 l-9 -6 v12 z" fill="#aaa"/>
  <text x="610" y="170" text-anchor="middle" font-size="10.5" fill="#bbb">委托</text>

  <!-- node 3 -->
  <rect x="640" y="120" width="230" height="130" rx="12" fill="#fff" stroke="#5a9364" stroke-width="1.5"/>
  <text x="755" y="152" text-anchor="middle" font-size="16" font-weight="700" fill="#3d6b47">采购 Agent #P-184</text>
  <text x="755" y="180" text-anchor="middle" font-size="12.5" fill="#666">比价 · 下单 ≤ $5,000</text>
  <text x="755" y="202" text-anchor="middle" font-size="12.5" fill="#b03a2e">&gt; $5,000 → 回到你审批</text>
  <text x="755" y="228" text-anchor="middle" font-size="11.5" fill="#999">边界：下单 ✓ · 付款待批</text>

  <line x1="875" y1="185" x2="925" y2="185" stroke="#aaa" stroke-width="2"/>
  <path d="M925 185 l-9 -6 v12 z" fill="#aaa"/>
  <text x="900" y="170" text-anchor="middle" font-size="10.5" fill="#bbb">调用</text>

  <!-- node 4 -->
  <rect x="930" y="120" width="230" height="130" rx="12" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="1045" y="152" text-anchor="middle" font-size="16" font-weight="700" fill="#777">供应商系统</text>
  <text x="1045" y="180" text-anchor="middle" font-size="12.5" fill="#888">外部 API · 契约接口</text>
  <text x="1045" y="202" text-anchor="middle" font-size="12.5" fill="#888">非 Agent · 不可委托</text>
  <text x="1045" y="228" text-anchor="middle" font-size="11.5" fill="#aaa">边界：系统终点</text>

  <!-- bottom ledger -->
  <rect x="60" y="290" width="1100" height="74" rx="10" fill="#f0f3f7" stroke="#d5dde8"/>
  <text x="88" y="320" font-size="13" font-weight="600" fill="#2c5d8f">Action Ledger</text>
  <text x="88" y="344" font-size="12" fill="#666">意图 → 计划 → 工具调用 → 副作用 → 证据，全链可回放</text>
  <g font-size="12" fill="#555">
    <text x="620" y="320">3 项子任务完成</text>
    <text x="760" y="320" fill="#b03a2e">1 项等待你的批准：$8,400 订单</text>
    <text x="620" y="344" fill="#888">审计日志：available · 撤销入口：始终可见</text>
  </g>

  <text x="620" y="404" text-anchor="middle" font-size="12.5" fill="#999">对比：今天大多数产品只显示一个头像和一句"正在为您处理……"</text>
</svg>
